# dsh-lcm — 参数配置文件示例
#
# 用法：
#   1) 复制到 profile 目录，例如 ~/.dsh/profiles/web/
#   2) 在 cordis.patch.yml 的 compaction 行上引用配置：
#
#        - id: compaction-lcm
#          name: dsh-lcm
#          config:
#            <<: *lcm            # 或在 patch 里直接内联下面这些键
#
#   3) 也可以把本文件的键直接写进 patch 的 config: 段（推荐，少一层缩进坑）
#
# 键的语义与 @deepseek-ai/dsh-compaction-basic **完全一致**，默认值也一致。
# 从 basic 迁过来时，你现有的配置可以原样贴进来，不需要改名或换算。

# ── 与 basic 共享的键（语义 + 默认值完全相同）──────────────────────────

# 触发压缩的压力占比。默认 0.8。
# 实际触发点 = floor(min(contextWindow × thresholdRatio, messageBudget − headroomTokens))
thresholdRatio: 0.8

# 为下一次补全预留的 token 容量。默认 65536。
# 也是摘要「目标长度」上限 maxTokens 的默认值来源。
headroomTokens: 65536

# 原样保留的最近尾部占「消息预算」的比例。默认 0.16。
# 与 retainTokens 互斥；两者都设会直接报错。
retainRatio: 0.16

# 原样保留的最近尾部 token 绝对上限。设了它就忽略 retainRatio。
# 默认不设（走 retainRatio）。
# retainTokens: 32768

# 摘要用哪个 provider/model。留空 = 沿用当前路由的模型。
# 两键必须同时为空或同时非空。
summarizationProvider: ""
summarizationModel: ""

# 摘要的目标长度上限（**不再作为请求的 maxTokens 发给 provider**）。
# 默认 = headroomTokens（65536）。它只参与「aim for roughly N tokens」这句提示，
# 不会截断模型输出：推理型后端会把小预算全花在 reasoning 上、正文为空，
# 那是实测过的整次压缩失败原因，所以这里不下发硬上限。
# maxTokens: 16384

# 压缩失败重试次数（同一次压力触发内）。默认 1。
compactionRetries: 1

# 上下文溢出后强制恢复的重试次数。默认 1。
maxOverflowRetries: 1

# 是否自动压缩。默认 true。关掉后只能手动 /compact。
auto: true

# 按精确 provider/model 覆盖上面任意键。默认 []。
modelPolicies: []
# modelPolicies:
#   - provider: omniroute
#     model: deepseek-v4-flash-auto
#     thresholdRatio: 0.75
#     headroomTokens: 32768

# ── LCM 专有键（只增行为，不改共享键的含义）────────────────────────────

# 单次摘要目标长度 = clamp(shadowed × summaryRatio, summaryFloorTokens, checkpointCap)
# 让压缩比在不同窗口下保持稳定，而不是被 headroomTokens 单点决定。
# 默认 0.12（≈ 8:1）。同样是「目标」，不是请求上限。
summaryRatio: 0.12

# 摘要预算下限，保证小片段也能产出可用摘要。默认 512。
summaryFloorTokens: 512

# 单次摘要目标长度的上限。默认 16384。
# 注意：它**不是**事后闸门 —— 模型超出这个数照样接受。真正兜住这次事务的是
# region 层的 shrink 保证（framed 摘要必须小于被替换的区间）。
checkpointCap: 16384

# 给摘要「逐字锚点」清单里的每一条事后补上 (seq N) 指针，让 lcm_expand 可以直接跟进，
# 不必先 lcm_search 猜一次。归因只扫被压缩区间，锚点在该区间里逐字找不到就不加指针。
# 纯本地计算、零网络、零额外 token，所以默认 true；设 false 输出与不开启时逐字节相同。
anchorPointers: true

# 模型返回「一个 text block 都没有」（只有 reasoning 或干脆空）时，同 prompt 同路由再试几次。
# 这是采样事故而不是确定性失败：吃到推理的后端会把预算全花在 reasoning 上，重试一次通常就有正文。
# 只在空文本时重试；已产出正文但被 provider 默认上限截断的确定性截断仍然立即失败，不重试。
# 默认 2（最多 3 次尝试）；设 0 关闭重试。
emptySummaryRetries: 2

# 引擎调试日志。默认 false；也可以设 DSH_COMPACTION_DEBUG=1 打开。
debug: false

# ── 工具/命令行（dsh-lcm/tool 与 /command）的键 ───────────────
# 保留原版 backend（dsh-compaction-instant）的工具与命令名：
#   recall / search 工具，/recall 命令
# 默认 true。改成 false 只注册 lcm_expand / lcm_search / /lcm-search。
# legacyNames: true
#   maxRecallTokens: 16000
#   maxSearchHits: 50

# 调试日志落盘路径。默认 $DSH_HOME/compaction-debug.log。
# debugLogPath: /tmp/compaction-debug.log
