# dsh-lcm — 参数配置文件示例
#
# 用法：
#   1) 复制到 profile 目录，例如 ~/.dsh/profiles/web/
#   2) 在 cordis.patch.yml 的 compaction 行上引用配置：
#
#        - id: compaction-lcm
#          name: dsh-lcm
#          config:
#            <<: *lcm            # 或在 patch 里直接内联下面这些键
#
#   3) 也可以把本文件的键直接写进 patch 的 config: 段（推荐，少一层缩进坑）
#
# 键的语义与 @deepseek-ai/dsh-compaction-basic **完全一致**，默认值也一致。
# 从 basic 迁过来时，你现有的配置可以原样贴进来，不需要改名或换算。

# ── 与 basic 共享的键（语义 + 默认值完全相同）──────────────────────────

# 触发压缩的压力占比。默认 0.75（lcm-x 的 context_threshold）。
# 实际触发点 = floor(min(contextWindow × thresholdRatio, messageBudget − headroomTokens))
thresholdRatio: 0.75

# 为下一次补全预留的 token 容量。默认 65536。
# 也是摘要「目标长度」上限 maxTokens 的默认值来源。
headroomTokens: 65536

# 原样保留的最近尾部占「消息预算」的比例。默认 0.05（1M 窗口下约 46 723 token）。
# 三种取值的实测算术（1M 窗口）：basic 的 0.16 → 尾部 149514 / 地板 250055 / 可压 499945；
# 0.05 → 46723 / 147264 / 602736；lcm-x 的 24000（≈0.026）→ 24296 / 124837 / 625163。
# 与 retainTokens 互斥；两者都设会直接报错。
retainRatio: 0.05

# 原样保留的最近尾部 token 绝对上限。设了它就忽略 retainRatio。
# 默认不设（走 retainRatio）。
# retainTokens: 32768

# 摘要用哪个 provider/model。留空 = 沿用当前路由的模型。
# 两键必须同时为空或同时非空。
summarizationProvider: ""
summarizationModel: ""

# 摘要的目标长度上限（**不再作为请求的 maxTokens 发给 provider**）。
# 默认 = headroomTokens（65536）。它只参与「aim for roughly N tokens」这句提示，
# 不会截断模型输出：推理型后端会把小预算全花在 reasoning 上、正文为空，
# 那是实测过的整次压缩失败原因，所以这里不下发硬上限。
# maxTokens: 16384

# 压缩失败重试次数（同一次压力触发内）。默认 1。
compactionRetries: 1

# 上下文溢出后强制恢复的重试次数。默认 1。
maxOverflowRetries: 1

# 是否自动压缩。默认 true。关掉后只能手动 /compact。
auto: true

# 按精确 provider/model 覆盖上面任意键。默认 []。
modelPolicies: []
# modelPolicies:
#   - provider: omniroute
#     model: deepseek-v4-flash-auto
#     thresholdRatio: 0.75
#     headroomTokens: 32768

# ── LCM 专有键（只增行为，不改共享键的含义）────────────────────────────

# 单次摘要目标长度 = clamp(shadowed × summaryRatio, summaryFloorTokens, checkpointCap)
# 让压缩比在不同窗口下保持稳定，而不是被 headroomTokens 单点决定。
# 默认 0.12（≈ 8:1）。同样是「目标」，不是请求上限。
summaryRatio: 0.12

# 摘要预算下限，保证小片段也能产出可用摘要。默认 512。
# 注意它和 maxTokens/checkpointCap 的先后：target = min(cap, max(floor, span×ratio)) 再取 min(maxTokens)。
# 也就是说 maxTokens 是最后一道上限，把它设到 floor 以下时 floor 会被压下去（maxTokens: 100 + floor: 512 → target 100）。
# 想要 floor 生效，就别把 maxTokens 设得比它小。
summaryFloorTokens: 512

# 单次摘要目标长度的上限。默认 16384。
# 注意：它**不是**事后闸门 —— 模型超出这个数照样接受。真正兜住这次事务的是
# region 层的 shrink 保证（framed 摘要必须小于被替换的区间）。
checkpointCap: 16384

# 一次压缩最多吃掉多少 token。默认 24000（借自 lcm-x 的 leaf_chunk_tokens）。
# 为什么要有这个上限：整段一次压完时，单次响应常被 provider 的上限截断，
# 实测 147k 跨度一次压完 → 5/15 题只剩一节；切成 7 个 20-23k 的叶 → 7/7 六节齐全、finish=stop。
# 叶请求**不重放宿主 system prompt**（lcm-x 也不重放），所以叶再多也不会每叶重发一遍系统提示。
# 0 关闭上限（回到整段一次压完）。
leafSpanTokens: 24000

# 越过阈值后是否连续压多个叶，直到「保留尾部之外的可压内容压完」为止。默认 true（同 lcm-x 的
# threshold_full_sweep_enabled）。设 false 回到「一次越阈值只放出一个叶」的旧行为。
# 为什么默认开：实测 1M 窗口、807187 tok（80.7%）时，一个 24000 的叶落地到 783136（78.3%），
# 已经在阈值下方，于是停下；下一次越阈值又只放一个叶。会话就一直焊在阈值附近，
# 每次付一整次模型调用只换来 2.4% 的窗口。开了之后一次越阈值就把积压压掉。
thresholdFullSweep: true

# 一次 sweep 最多放几个叶。默认 12（同 lcm-x 的 _THRESHOLD_FULL_SWEEP_MAX_PASSES）。
# 12 × 24000 = 288000，即 1M 窗口的 28.8%，够把会话从阈值上推开而不会把单步变成无界开销。
fullSweepMaxPasses: 12

# 一次 sweep 的墙钟**硬**上限（秒）。默认 120，与 lcm-x 的
# _THRESHOLD_FULL_SWEEP_MAX_SECONDS 一致。
# 之所以敢用 120（而不是像早先那样必须 600 才能抽干），是因为有了空闲续跑：
# 一次 sweep 抽不完不要紧，agent 进入 idle 时会自动再跑一轮（_continueOnIdle）。
# 抽干的总量不变：地板 = 系统提示 100541 + 保留尾部 149514 = 250055，
# 从阈值 800000 抽到地板需 31 个叶、实测 17.3 秒/叶 → 合计 522 秒，
# 现在分摊到几轮空闲 pass，而不是一次阻塞十分钟。
fullSweepMaxSeconds: 120

# 软目标（秒）：到了就不再**开**新叶，把剩下的一半留给正在跑的那个叶和收尾。
# 默认 60，即硬上限的一半 —— 与 lcm-x 的 foreground_soft_seconds 一致。
# 没有这一层时，剩 5 秒也会开一个 17 秒的叶，实际超支 12 秒才停。
fullSweepSoftSeconds: 60

# 硬上限里为「提交 + 重新测量」预留的秒数。默认 10，取 lcm-x
# finalize_reserve 区间（5–20）的中点：最后一个叶返回后还要落盘和重测，
# 不留这一块，硬上限就是循环兑现不了的承诺。
fullSweepReserveSeconds: 10

# 软目标判定用的「一个叶要多久」的下限（秒）。默认 15（同 lcm-x 的
# _THRESHOLD_FULL_SWEEP_MIN_CALL_SECONDS）。没有下限时，一次很快的凝聚 pass
# 会让循环误以为下一个叶也那么快。
leafEstimateFloorSeconds: 15

# 同深度 checkpoint 凑够几个就合并成上一层的一个节点。默认 4（同 lcm-x 的 condensation_fanin）。
# **下限是 2，不是 1**：`fanin > 1` 是唯一会「跳过已在表面上的 checkpoint」的分支，
# 设 1 等于把它和凝聚一起关掉 —— 每叶都从上一个 checkpoint 起，表面永远只有一个节点、深度一路涨。
# 所以 1 在 schema 和 config 两层都会被拒绝。
condensationFanin: 4

# 「有压力但没东西可压」时的冷却时间（毫秒）。默认 60000。
# 越阈值却选不出可压区间（保留尾部太大、span 低于下限）时，不必每个 step 重判一次：
# 三个条件任一成立即解除 —— 存下了新 checkpoint、会话又长了 leafSpanTokens、或冷却到期。
stallCooldownMs: 60000

# 给摘要「逐字锚点」清单里的每一条事后补上 (seq N) 指针，让 lcm_expand 可以直接跟进，
# 不必先 lcm_search 猜一次。归因只扫被压缩区间，锚点在该区间里逐字找不到就不加指针。
# 纯本地计算、零网络、零额外 token，所以默认 true；设 false 输出与不开启时逐字节相同。
anchorPointers: true

# 模型返回「一个 text block 都没有」（只有 reasoning 或干脆空）时，同 prompt 同路由再试几次。
# 这是采样事故而不是确定性失败：吃到推理的后端会把预算全花在 reasoning 上，重试一次通常就有正文。
# 只在空文本时重试；已产出正文但被 provider 默认上限截断的确定性截断仍然立即失败，不重试。
# 默认 2（最多 3 次尝试）；设 0 关闭重试。
emptySummaryRetries: 2

# 引擎调试日志。默认 false；也可以设 DSH_COMPACTION_DEBUG=1 打开。
debug: false

# ── 这些键属于搜索工具行（id: tool-lcm-expand，name: dsh-lcm/tool）──
# 不是引擎行。引擎的 schema 声明并解析 vector*，但压缩路径一个都不读，
# 所以把 vectorEnabled 写在 compaction-lcm 上只会让 --dump-config 看起来开着，
# 而 lcm_search 实际仍走词面。这一条曾被本文档写错，已改。
#
# 保留原版 backend（dsh-compaction-instant）的工具与命令名：
#   recall / search 工具，/recall 命令
# 默认 true。改成 false 只注册 lcm_expand / lcm_search / /lcm-search。
# legacyNames: true
# maxRecallTokens: 16000
# maxSearchHits: 50
#
# 语义检索（默认关；两个闸门都要开：vectorEnabled + rank=vector|hybrid）：
# vectorEnabled: true
# rank: hybrid              # vector 会「替换」命中集，字面串会失去位置；hybrid 用 RRF 融合
# vectorBaseUrl: "http://10.126.126.4:20128/v1"
# vectorModel: "mistral-proxy/codestral-embed"
# vectorDim: 1536
# vectorTopK: 8
# 托管网关需要 bearer token，本地 LM Studio 不需要。这里写的是**环境变量名**，不是密钥本身 ——
# 密钥直写进配置就会随仓库发布出去。留空（默认）表示不发送 Authorization 头。
# vectorApiKeyEnv: "OMNIROUTE_API_KEY"
#
# 候选窗口按 token 计价，因为成本跟着文本长度走、不跟事件数走：
# 实测约 18 ms/条 + 0.23 ms/token，批量大小 8–128 都只有 87–92 ms/条，
# 并发反而更慢（8 个并发 32 条 POST = 205 ms/条）。
# vectorCandidateTokens: 100000   # ≈200 条已压缩事件，冷启约 19 s，之后按文本命中磁盘缓存
# vectorCandidateLimit: 500       # 条数上限，防止大量极短事件用同样成本塞满窗口
# vectorTimeoutMs: 20000
# vectorCacheDir: ".lcm-vectors"
#
# 候选只取「当前表面看不到的」那些事件。给 live 尾部做排序是纯浪费
# （那些消息本来就在模型上下文里）；从没压缩过的会话因此没有候选，hybrid 结果等同词面。
#
# 密钥来源（vectorApiKeyEnv 给的是名字）按顺序找两处：
#   1. 进程环境变量 <NAME>
#   2. dsh 凭证库 $DSH_HOME/.credentials.yaml 顶层 refs: 下的 <NAME>: <value>
# 都没有就不发 Authorization 头；托管网关会回 401，检索降级到词面并在结果里带一条 notice。
# /lcm-embed status 的 auth: 那一行会明确写出当前是哪一处供的密钥。
#
# ── 向量缓存行（id: command-lcm-embed，name: dsh-lcm/command）──
# 同一模块的第二个 Loader 行。命令名在注册表里是全局的，重名注册是硬错误，
# 所以 commandSet 决定这一行挂哪一族：search（默认，/lcm-search + /lcm-status + /recall）
# 或 embed（/lcm-embed）。下面是 embed 行：
# commandSet: embed
# vectorEnabled: true
# vectorBaseUrl: "http://10.126.126.4:20128/v1"
# vectorModel: "mistral-proxy/codestral-embed"
# vectorDim: 1536
# vectorApiKeyEnv: "OMNIROUTE_API_KEY"
# vectorCandidateTokens: 100000
# vectorCandidateLimit: 500
# 缓存根目录保持默认 .lcm-vectors：backfill 填的是 lcm_search 要读的那份缓存，
# 换个目录等于白填。目录本身按模型分（模型摘要前 12 位 hex + 维度），共用根目录是安全的。
#
# 换模型：改 vectorModel 与 vectorDim，旧模型的目录会留下来但再不会被读到。
# 想把旧目录一起清掉用 pruneForeignVectorCaches；/lcm-embed 只填不删。

# 调试日志落盘路径。默认 $DSH_HOME/compaction-debug.log。
# debugLogPath: /tmp/compaction-debug.log
