# dsh-lcm bundle patch.
#
# Installing this package with `plugin_manager` `install_bundle` makes it a
# profile layer (package.json declares `dsh.bundle.patch`). Two planes, one
# file, because a profile composes both and only one of them can win.
#
# ── Host plane ────────────────────────────────────────────────────────────
# The built-in summarizer yields (`auto: false`: the row stays registered, so
# `ctx.compaction` keeps exactly one owner) and the LCM engine takes that seam,
# with its recovery half (`lcm_search`, `lcm_expand`, `/lcm-search`). This is
# the whole story for a profile that mounts no agent preset.
#
# ── Preset plane ──────────────────────────────────────────────────────────
# A profile with agent presets composes compaction INSIDE each preset group,
# behind `isolate: {compaction: true}`, so the host rows above cannot reach it.
# The override recipe — restating a preset's whole `config` with one row
# substituted — works, but it freezes a snapshot of the shipped plugin list:
# every upstream preset update has to be re-copied by hand or it is silently
# pinned. This file no longer does that.
#
# Instead each preset row carries `inject: [lcmCompactionPolicy]`. A Loader
# entry cannot register until every service in its inject list is provided, so
# the four Web presets WAIT for the gate. The gate entry
# (`lcm-compaction-gate`, name `dsh-lcm/gate`) provides that service, and
# before providing it registers a GLOBAL middleware on the `internal/config`
# event. That middleware receives each resolved plugin config and rewrites any
# `compaction` group nested in it:
#
#     name: @deepseek-ai/dsh-compaction-basic -> { id: compaction-lcm, name: dsh-lcm }
#
# `command-compact`, `tool-result-pruner` and their config are left exactly as
# shipped. The match is STRUCTURAL — on the row's `name`, never on its `id` —
# so shipped presets need no restatement, upstream preset updates keep working,
# and a profile that renames rows still resolves to the same package.
#
# Degradation never bricks a profile: a host without `ctx.on` rewrites nothing
# (stock basic compaction runs), and a host without `ctx.reflect.provide` just
# never latches the presets (they boot as they did before this bundle).
#
# The host `compaction-basic` row stays registered for a different reason: it
# is a different realm from the preset group, so it cannot reach the preset's
# copy, while a profile without presets still needs it stood down to avoid two
# engines on one context.
#
# No shipped file is edited. Removing this bundle removes the gate and the
# stock composition returns.
- insert:
    - id: compaction-lcm
      name: dsh-lcm
      # No vector keys on this row on purpose. The engine declares vector* in its
      # schema and resolves them in its config, but nothing in the compaction
      # path reads them: the semantic route belongs to the SEARCH surface below.
      # A "vectorEnabled: true" here looked enabled in --dump-config while
      # "search" quietly stayed lexical.
      config:
        # Two clocks and a reserve, exactly lcm-x's ForegroundBudget numbers.
        #
        # These are affordable only because a sweep no longer has to finish in one
        # turn: _continueOnIdle resumes it when the agent goes idle, which is the
        # gap lcm-x fills with its next pre-step. The drain is unchanged — one
        # leaf reclaims 18 216, the floor is system prompt 100 541 + retained tail
        # 149 514 = 250 055, so 800 000 -> 250 055 needs 31 leaves and 522 s at the
        # measured 17.3 s each — it is now paid over a few idle passes instead of
        # one ten-minute block.
        fullSweepMaxSeconds: 120
        # Stop STARTING leaves here, keeping the other half to finish the leaf in
        # flight plus the finalize. lcm-x uses the same ratio (60 of 120): without
        # it a leaf admitted with 5 s left overruns the ceiling by its own length.
        fullSweepSoftSeconds: 60
        # Slice of the hard ceiling kept for the commit and re-measure after the
        # last leaf returns, lcm-x's finalize_reserve (theirs is clamp(p90, 5, 20)).
        fullSweepReserveSeconds: 10
        # Floor for the measured leaf cost the soft test uses, lcm-x's
        # _THRESHOLD_FULL_SWEEP_MIN_CALL_SECONDS. Without a floor one fast
        # condensation pass would claim the next leaf is that fast too.
        leafEstimateFloorSeconds: 15
    - id: tool-lcm-expand
      name: dsh-lcm/tool
      # Vector recall layer, on the row that actually calls it: resolveConfig in
      # src/tool.js hands these keys to searchSessionHybrid, and without "rank"
      # the layer is inert anyway (the default is the measured lexical
      # "density"). Endpoint, model and dimension were measured to answer 200
      # with 4096 floats.
      #
      # rank: hybrid, not vector. A vector-only rank replaces the hit set instead
      # of adding to it: it top-Ks the recent window by cosine, so a literal
      # pattern (an id, a path, an error code) the log matches exactly loses to
      # events that are merely similar in topic. Hybrid fuses the lexical ranks
      # with the semantic ones (RRF), so exact matches keep their place and a
      # wording mismatch can still surface. A dead endpoint degrades this to
      # plain lexical with a notice, so the setting cannot break a search.
      config:
        rank: hybrid
        vectorEnabled: true
        # OmniRoute's codestral-embed. Measured 2026-11-09: 1536 dimensions,
        # batch 32 accepted, CJK accepted, empty string refused with HTTP 400
        # (which the per-item degradation already handles by skipping it).
        # Five consecutive probes on the undated name: 5/5 HTTP 200, 1.1-10.5 s.
        vectorBaseUrl: http://10.126.126.4:20128/v1
        vectorModel: mistral-proxy/codestral-embed
        vectorDim: 1536
        # The NAME of the environment variable holding the bearer token. A
        # hosted gateway needs one; a local LM Studio does not. The literal key
        # never appears here, because this file is in the repository.
        vectorApiKeyEnv: OMNIROUTE_API_KEY
        # The candidate window is what the model CANNOT read: events off the
        # session surface. The visible tail is already in context verbatim, so
        # embedding it would be pure waste - on the measured 24k-event session
        # 19800 events were still visible and only 4213 were compacted.
        #
        # Cost tracks length, not event count (32 texts: 27/33/60/119/230 ms per
        # text at 40/200/800/2000/4000 chars ~ 18 ms + 0.23 ms per token), so the
        # primary bound is tokens.
        #
        # Retuned 2026-11-09 for a REMOTE endpoint. 100 000 used to be right for a
        # local LM Studio at ~30 ms/text; mistral-proxy/codestral-embed measures
        # 2.6-5.1 s per 32-text batch with a 65.6 s tail, so a 200-event window was
        # ~7 batches and the first live search timed out at 20 s and fell back to
        # lexical. 30 000 is ~60 events, two batches: a cold search finishes inside
        # the timeout, and once /lcm-embed backfill has warmed the cache the window
        # costs nothing anyway. Raise it again on a local endpoint.
        vectorCandidateTokens: 30000
        vectorCandidateLimit: 500
        # 30 s, not the 20 s default: it covers a typical pair of batches plus one
        # moderate stall, and still degrades rather than hanging on the 65 s tail.
        vectorTimeoutMs: 30000
    - id: command-lcm-search
      name: dsh-lcm/command
    # The vector-cache surface, a second row of the same module. It must be a
    # separate row because its vector settings belong to it alone, and it must
    # say which commands it owns (`commandSet`): command names are global in
    # the registry and a duplicate registration is a hard error, so the search
    # row keeps /lcm-search, /lcm-status and /recall while this one owns
    # /lcm-embed.
    #
    # Same endpoint, model, width and window as the tool row above, and the
    # same DEFAULT cache root (.lcm-vectors): backfill would be pointless if it
    # filled a cache the search tool never reads. The directory is per model
    # (12 hex of the model digest + width), so sharing the root is safe.
    #
    # /lcm-embed backfill is dry-run by default, like lcm-x's `/lcm embed
    # backfill`; `--apply` is the operator's switch to spend provider calls.
    - id: command-lcm-embed
      name: dsh-lcm/command
      config:
        commandSet: embed
        vectorEnabled: true
        vectorBaseUrl: http://10.126.126.4:20128/v1
        vectorModel: mistral-proxy/codestral-embed
        vectorDim: 1536
        vectorApiKeyEnv: OMNIROUTE_API_KEY
        # The SAME window as the search row above, and that is deliberate:
        # /lcm-embed status prices its candidates from THIS row's config, so a
        # different number here would report a pending count the search never
        # asks for — and a backfill would warm texts no search reads. Both rows
        # currently agree; keep them that way.
        vectorCandidateTokens: 30000
        vectorCandidateLimit: 500
        # A backfill pass is offline work, so it tolerates the endpoint's tail.
        # Measured 2026-11-09 on mistral-proxy/codestral-embed: eight consecutive
        # 32-text batches returned 200 at 2.6/5.1/3.0/65.6/2.6 s, and a longer
        # run produced one HTTP 500. The search row keeps the 20 s default so an
        # interactive search degrades quickly instead of hanging; this row waits.
        vectorTimeoutMs: 240000
    - id: lcm-compaction-gate
      name: dsh-lcm/gate

# ── host plane ────────────────────────────────────────────────────────────
# `disabled: true`, NOT `config: {auto: false}`.
#
# `auto: false` only turns off basic's automatic listeners; the row still
# activates and still registers the `compaction` service, so our engine fails to
# take the seam with "service \"compaction\" has been registered at
# <BasicCompactionEngine>". Measured on a fresh `headless` profile with this
# bundle installed: that error, "1 entry did not activate", and the profile left
# with NO compaction engine at all (basic stood down by the same config, ours
# rejected) — while `--dump-config` showed every row and looked correct. The web
# profile only worked because @deepseek-ai/dsh-web-app happens to set
# `disabled: true` on this same row; a profile without that bundle had nothing.
- id: compaction-basic
  disabled: true

# ── preset plane ──────────────────────────────────────────────────────────
# One key each: the inject list is the whole patch. Entry inject lists are
# REPLACED by patches, not concatenated — if a future dsh ships its own inject
# list on these entries, merge manually here.
- id: preset-standard
  inject: [lcmCompactionPolicy]
- id: preset-ptc
  inject: [lcmCompactionPolicy]
- id: preset-minimal
  inject: [lcmCompactionPolicy]
- id: preset-cordis
  inject: [lcmCompactionPolicy]
